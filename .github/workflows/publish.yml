name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify plugin loads and smoke tests pass
        run: node --check index.js && node smoke-test.mjs

      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Check tag matches package.json version
        if: github.event_name != 'workflow_dispatch'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}"
          if [ "v$PKG_VERSION" != "$TAG" ] && [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Publish
        run: npm publish
