name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Run scripts/check.sh (syntax, smoke under node and bun, dash scan)
        run: bash scripts/check.sh --only syntax,smoke,dashes

      - name: Check if version is already published
        id: version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if OUTPUT=$(npm view "$PKG_NAME@$PKG_VERSION" version 2>&1); then
            echo "Version $PKG_VERSION already published, skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif echo "$OUTPUT" | grep -q "E404"; then
            echo "Version $PKG_VERSION not on npm yet, publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm view failed for a reason other than E404, refusing to guess:"
            echo "$OUTPUT"
            exit 1
          fi

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@11.5.1

      - name: Publish
        run: npm publish
